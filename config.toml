# config.toml

[network]
host = "0.0.0.0"
server_ip = "auto"
tcp_port = 2627
udp_port = 2627

[game]
motd = "Welcome to Wulf-Forge!"
map_name = "crossroads"

[player]
name = "default"
nametag = "DEV"
team = 1
unit_type = 0

[debug]
debug_packets = true
show_ascii = false
debug_actions = false
debug_action_packets = false
# Log every packet opcode, including high-frequency per-tick traffic
# (UPDATE_ARRAY/VIEW_UPDATE/PING/etc). All packet lines are written to the
# timestamped file in logs/. Off by default to keep the log readable.
log_all_opcodes = false
# Verbose per-tick server tank-sim logging: active players' inputs + resulting
# pos/vel/yaw, and owner-correction suppressed/sent decisions.
debug_physics_sim = true
# Send owner its simulated transform every tick (DISABLE suppression) so the
# divergence between server sim and client is visible as rubber-banding.
# Off = suppress = client owns its own rotation/position (smooth turn + tilt).
correct_owner_in_sim = false

[sync]
# server_simulation: action packets drive server-side tank simulation (TankSim).
# client_state_relay: modified clients provide transform state for rebroadcast.
mode = "server_simulation"

[mod_relay]
# Used when sync.mode = "client_state_relay".
port = 28010
owner_auth = true
debug_mapping = true
auto_bind = true
identity_trace = true
coalesce_updates = true
echo_owner_state = false
hard_sync = false
adaptive_hard_sync = true
hard_sync_teleport_distance = 250.0
hard_sync_stale_ms = 500
hard_sync_initial_packets = 3
apply_velocity = true
apply_rotation = true
apply_spin = false
