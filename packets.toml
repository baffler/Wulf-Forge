# packets.toml

[tank]
unit_type = 0
team_id = 1 # this will change at runtime, just leaving it here for now
default_pos = [100.0, 100.0, 100.0]
default_rot = [0.0, 0.0, 0.0]

[tank.stats]
include_vitals = true
weapon_id = 0
health_mult_bits = 1
energy_mult_bits = 1

[behavior]
weapons_units_count = 4
weapon_slots_count = 13
unit_count = 39
vehicle_physics_count = 2
active_vehicles_count = 3

[behavior.header]
allow_immediate_respawn = 0  # bool: instant (re)spawn on entry-select confirm
session_timeout_secs = 5.0   # world-leave / session-reset deadline (seconds)
gravity_accel = 100.0        # vertical gravity acceleration

# Former "unk11" block — 11 fixed16.16 floats parsed in this order by
# Net_HandleBehavior (0x0046dc00). Names reflect each value's verified consumer.
building_wedge_radius = 1.0  # 0x679180: building map-icon cone-wedge length (+ deploy primary radius)
deploy_backup_radius = 1.0   # 0x679184: deploy backup-cell probe radius
target_bar_extent = 1.0      # 0x679188: HUD target status/range-bar param
reserved_3 = 1.0             # 0x67918c: parsed but unused (dead slot)
factory_arc_inner = 1.0      # 0x679190: factory icon arc-wedge near radius
factory_arc_outer = 1.0      # 0x679194: factory icon arc-wedge far radius
reserved_6 = 1.0             # 0x679198: parsed but unused (dead slot)
radar_arc_inner = 1.0        # 0x67919c: radar icon arc-wedge near radius
radar_arc_outer = 1.0        # 0x6791a0: radar icon arc-wedge far radius
silo_wedge_radius = 1.0      # 0x6791a4: silo icon cone-wedge length
target_lock_delay = 1.0      # 0x6791ac: target lock-on eligibility delay (seconds)

[behavior.unit_defaults]
scale = 1.0
max_health = 100
regen_or_health_related = 100.0

[behavior.vehicle_physics]
# Tank/type-0 defaults from VehicleInfo_CreateForType (0x004e5a20).
bang_min_velocity = 20.0
scrape_min_velocity = 4.0
bang_interval_ms = 700
scrape_interval_ms = 550
starting_jet_strength = 0.8
minimum_jet_strength = 0.05
jet_response_coefficient = 1.3
max_weapon_weight = 0
max_fuel = 33000

[behavior.scout_vehicle_physics]
# Medic/scout/type-1 defaults from VehicleInfo_CreateForType (0x004e5a20).
bang_min_velocity = 20.0
scrape_min_velocity = 4.0
bang_interval_ms = 700
scrape_interval_ms = 550
starting_jet_strength = 0.8
minimum_jet_strength = 0.15
jet_response_coefficient = 1.1
max_weapon_weight = 0
max_fuel = 13000

[behavior.active_vehicle_physics]
# Tank tuning. The stock server_params max altitude is 3.25; the emulator
# uses 4x stock for better terrain and base-unit clearance.
turn_adjust = 4.5   # Default: 4.5
move_adjust = 85.0  # Default: 85.0
strafe_adjust = 69.7
max_velocity = 80.0
low_fuel_level = 2000.0
hover_height = 13.0
gravity_pct = 1.0

[behavior.medic_vehicle_physics]
# Scout tuning from MedicVehicleTuning_ConstructDefaults (0x004f6690).
turn_adjust = 4.5
move_forward_adjust = 85.0
move_backward_adjust = 38.0
strafe_adjust = 72.0
max_velocity = 85.0
low_fuel_level = 2000.0
max_altitude = 4.9
max_speed_height_pickup = 3.5
gravity_pct = 1.0
